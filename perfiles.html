
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Netflix - Selección de perfiles</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background-color: #141414;
      color: white;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    .logo {
      color: #e50914;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -2px;
      padding: 25px 4%;
    }

    .profiles-container {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
    }

    .profile-title {
      font-size: clamp(1.8rem, 4vw, 3.5rem);
      font-weight: 400;
      margin-bottom: 35px;
    }

    .profiles {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 25px;
    }

    .profile {
      width: 140px;
      background: none;
      border: none;
      color: #808080;
      cursor: pointer;
      transition: color .2s, transform .2s;
    }

    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 5px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 75px;
      border: 3px solid transparent;
      overflow: hidden;
      transition: border-color .2s;
    }

    .profile:hover {
      color: white;
      transform: scale(1.05);
    }

    .profile:hover .avatar {
      border-color: white;
    }

    .profile-name {
      display: block;
      margin-top: 12px;
      font-size: 1.1rem;
    }

    .avatar-blue { background: #1769aa; }
    .avatar-orange { background: #d66b25; }
    .avatar-green { background: #287a54; }
    .avatar-purple { background: #7544a5; }

    .manage-btn {
      margin-top: 55px;
      padding: 8px 25px;
      background: transparent;
      color: #808080;
      border: 1px solid #808080;
      letter-spacing: 2px;
      transition: all .2s;
    }

    .manage-btn:hover {
      color: white;
      border-color: white;
    }

    @media (max-width: 576px) {
      .logo {
        font-size: 1.6rem;
      }

      .profile {
        width: 110px;
      }

      .avatar {
        width: 110px;
        height: 110px;
        font-size: 58px;
      }

      .profiles {
        gap: 20px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">LUTOFLIX</div>
  </header>

  <main class="container-fluid profiles-container">
    <h1 class="profile-title text-center">
      ¿Quién está viendo?
    </h1>

    <div class="profiles">
      <a href="./index.html">
        <button class="profile">
        <div class="avatar avatar-blue">👨🏻</div>
        <span class="profile-name">Juan</span>
      </button>
      </a>
      
      <a href="./index.html">
        <button class="profile">
        <div class="avatar avatar-orange">👩🏻</div>
        <span class="profile-name">María</span>
      </button>
      </a>
      
      <a href="./index.html">
        <button class="profile">
        <div class="avatar avatar-green">👨‍👩‍👧</div>
        <span class="profile-name">Familia</span>
      </button>
      </a>
      
      <a href="./index.html">
        <button class="profile">
          <div class="avatar avatar-purple">🧒</div>
          <span class="profile-name">Niños</span>
        </button>
      </a>
      

    </div>

    <button class="manage-btn" onclick="manageProfiles()">
      ADMINISTRAR PERFILES
    </button>
  </main>

  <script>
    function manageProfiles() {
      alert("Administración de perfiles de demostración");
    }
  </script>
</body>
</html>
